name: Apps

# Builds Raken for Windows (.exe), Mac (.dmg) and Android (.apk) on every push.
# Each run attaches the installers as artifacts; pushing a tag like v2.0.0 also
# publishes them to a GitHub Release.

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Build DMG
        working-directory: desktop
        env:
          # Optional repository variable: the URL where you host Raken. Leave unset
          # and the app runs the Raken server on the computer itself.
          RAKEN_SERVER_URL: ${{ vars.RAKEN_SERVER_URL }}
          # Optional signing and notarization secrets. Without them the app is
          # ad-hoc signed and macOS asks users to confirm on first open.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 != '' }}
        run: |
          # Unset secrets that are not configured; an empty CSC_LINK is read as a path.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: Raken-mac
          path: desktop/dist/*.dmg
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Build EXE
        working-directory: desktop
        env:
          RAKEN_SERVER_URL: ${{ vars.RAKEN_SERVER_URL }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Raken-windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build APK
        working-directory: android
        env:
          # The Android app can't run the server itself; set this repository
          # variable to your hosted Raken, or the app asks for an address on first launch.
          RAKEN_SERVER_URL: ${{ vars.RAKEN_SERVER_URL }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RAKEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RAKEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RAKEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Optional: sign with your own key so updates install over older versions.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/raken.jks"
            export RAKEN_KEYSTORE="$RUNNER_TEMP/raken.jks"
          fi
          gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Raken-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
